name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Por ref: PRs não disputam a fila de deploy; pushes na main seguem serializados.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm

      - name: Instalar dependências reproduzíveis
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Testes de regressão (cálculo AC4 e .ics)
        run: node tests/run-tests.mjs

      - name: Smoke test de interface (Chrome headless)
        run: node tests/smoke.mjs

      - name: Validação mobile (touch targets, barra fixa, overflow)
        run: node tests/mobile-check.mjs

      - name: Validação mobile premium v55
        run: node tests/mobile-v55-check.mjs

      - name: Core Web Vitals — CLS e interações críticas
        run: node tests/web-vitals-check.mjs

  deploy:
    needs: test
    # PRs só testam — deploy acontece apenas em push na main / dispatch manual.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Montar artefato público (só os arquivos do app — sem docs, tests, tools e capturas)
        run: |
          mkdir -p _site
          rsync -a --exclude '.git*' --exclude '_site' \
            --exclude 'docs' --exclude 'tests' --exclude 'tools' --exclude 'artifacts' \
            --exclude 'eslint.config.mjs' --exclude 'node_modules' --exclude '.editorconfig' \
            --exclude 'package*.json' --exclude '*.md' \
            ./ _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
